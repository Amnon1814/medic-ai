services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: medic, POSTGRES_PASSWORD: medic, POSTGRES_DB: medic }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgresql://medic:medic@db:5432/medic" }
    ports: ["8000:8000"]
    depends_on: [db]
volumes: { pgdata: {} }
